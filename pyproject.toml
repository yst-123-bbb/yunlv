[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrip-ai"
version = "2.0.0"
description = "云旅AI：多源旅行数据、行程规划与预算服务"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "trafilatura",
    "playwright",
    "ics",
    "reportlab",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=core --cov=providers --cov=infra --cov-report=term-missing"