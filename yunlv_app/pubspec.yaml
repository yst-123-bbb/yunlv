name: yunlv_app
description: "云旅 App —— 旅游规划助手（Flutter 课程大作业）"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 网络请求（DeepSeek AI 增强）
  http: ^1.2.0
  # 获取应用文档目录（本地文件导出）
  path_provider: ^2.1.0
  # 轻量级键值对持久化（偏好设置）
  shared_preferences: ^2.5.5
  # SQLite 数据库（收藏 / 历史行程）
  sqflite: ^2.4.3
  # SQLite 桌面端（Windows）FFI 实现，桌面开发时用 databaseFactoryFfi
  sqflite_common_ffi: 2.3.7+1
  # 打包 sqlite3 原生动态库（Windows 桌面端需要）
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3.x 改用 JNI 实现，需要 NDK 且国内环境易报
# MissingPluginException；固定到 2.2.x（传统 MethodChannel 实现，稳定）
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true

  # 本地结构化数据资源（由 云旅ai 迁移而来）
  assets:
    - assets/data/
